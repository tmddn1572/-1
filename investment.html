<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>투자 기록 - 나의 기록장</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3b5bfd" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="나의 기록장" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="lock-gate"></div>

  <div id="app-content" hidden>
    <header class="appbar">
      <span class="appbar-title">투자 기록</span>
      <div class="appbar-left">
        <button class="appbar-action" id="lock-btn" aria-label="잠그기"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg></button>
        <a href="settings.html" class="appbar-action" aria-label="설정"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      </div>
    </header>

    <main class="page-content">
      <div class="toolbar">
        <input type="search" id="search-input" placeholder="종목/자산명 검색" />
        <div class="filter-scroll" id="tag-filter"></div>
      </div>
      <div class="list" id="record-list"></div>
    </main>

    <button class="fab" id="add-btn" aria-label="기록 추가"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>

    <nav class="tabbar" aria-label="주요 메뉴">
      <a href="index.html" class="tab-item"><span class="tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="tab-label">홈</span></a>
      <a href="schedule.html" class="tab-item"><span class="tab-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="tab-label">일정</span></a>
      <a href="investment.html" class="tab-item active"><span class="tab-icon"><svg class="icon" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span><span class="tab-label">투자</span></a>
      <a href="diary.html" class="tab-item"><span class="tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span class="tab-label">일기</span></a>
    </nav>

    <!-- 기록 등록/수정 모달 -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <h2 id="modal-title">투자 기록 추가</h2>
          <button class="modal-close" id="modal-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="modal-body">
          <form id="record-form">
            <input type="hidden" id="f-id" />
            <div class="field">
              <label for="f-datetime">일시</label>
              <input type="datetime-local" id="f-datetime" required />
            </div>
            <div class="field">
              <label for="f-symbol">종목 / 자산명</label>
              <input type="text" id="f-symbol" required placeholder="예: 삼성전자, 비트코인" />
            </div>
            <div class="field">
              <label for="f-action">판단 내용</label>
              <textarea id="f-action" required placeholder="예: 매수, 매도, 관망 등 자유롭게"></textarea>
            </div>
            <div class="field">
              <label for="f-rationale">근거</label>
              <textarea id="f-rationale" placeholder="이렇게 판단한 이유"></textarea>
            </div>
            <div class="field">
              <label for="f-expectation">예상 (선택)</label>
              <textarea id="f-expectation" placeholder="앞으로 어떻게 될 것 같은지"></textarea>
            </div>
            <div class="field">
              <label>감정 태그 (다중 선택)</label>
              <div class="chip-group" id="emotion-group">
                <button type="button" class="chip" data-value="불안">불안</button>
                <button type="button" class="chip" data-value="확신">확신</button>
                <button type="button" class="chip" data-value="조급함">조급함</button>
                <button type="button" class="chip" data-value="무덤덤">무덤덤</button>
                <button type="button" class="chip" data-value="흥분">흥분</button>
                <button type="button" class="chip" data-value="후회">후회</button>
              </div>
            </div>
            <div class="field">
              <label>확신도</label>
              <div class="confidence-picker" id="confidence-picker">
                <span class="confidence-star" data-value="1">★</span>
                <span class="confidence-star" data-value="2">★</span>
                <span class="confidence-star" data-value="3">★</span>
                <span class="confidence-star" data-value="4">★</span>
                <span class="confidence-star" data-value="5">★</span>
              </div>
            </div>

            <div class="field" style="margin-top:22px;">
              <label>결과 (나중에 채워도 돼요)</label>
              <div class="segmented" id="result-segmented">
                <button type="button" data-value="">미정</button>
                <button type="button" data-value="correct">맞음</button>
                <button type="button" data-value="incorrect">틀림</button>
                <button type="button" data-value="ambiguous">애매함</button>
              </div>
            </div>
            <div class="field">
              <label for="f-result-note">결과 메모</label>
              <textarea id="f-result-note" placeholder="결과에 대한 메모 (선택)"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger hidden" id="delete-btn">삭제</button>
          <button type="submit" form="record-form" class="btn btn-primary">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/investment.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
