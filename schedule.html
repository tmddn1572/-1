<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>일정 - 나의 기록장</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="나의 기록장" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180-v2.png" />
<link rel="icon" href="icons/icon-192-v2.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="appbar">
    <span class="appbar-title">일정</span>
    <a href="settings.html" class="appbar-action" aria-label="설정"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </header>

  <main class="page-content">
    <div class="dash-card">
      <div class="dash-row">
        <div class="dash-tile">
          <div class="dash-value" id="dash-today-ratio">0/0</div>
          <div class="dash-label">오늘 완료</div>
        </div>
        <div class="dash-tile">
          <div class="dash-value" id="dash-today-score">+0</div>
          <div class="dash-label">오늘 획득</div>
        </div>
        <div class="dash-tile">
          <div class="dash-value" id="dash-total-score">0</div>
          <div class="dash-label">누적 총점</div>
        </div>
      </div>
      <div class="dash-row">
        <div class="dash-tile">
          <div class="dash-value" id="dash-perfect-days">0일</div>
          <div class="dash-label">완료한 일수</div>
        </div>
        <div class="dash-tile">
          <div class="dash-value" id="dash-streak">0일</div>
          <div class="dash-label">연속 달성 <svg class="icon" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></div>
        </div>
      </div>
    </div>

    <div class="cal-nav">
      <button class="cal-nav-btn" id="prev-month" aria-label="이전 달"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="cal-month-label">
        <span id="month-label">2026년 8월</span>
        <button class="cal-today-btn" id="today-btn">오늘</button>
      </div>
      <button class="cal-nav-btn" id="next-month" aria-label="다음 달"><svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>

    <div class="cal-weekdays">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>

    <div class="day-panel">
      <div class="day-panel-title" id="day-panel-title">일정</div>
      <div class="list" id="day-list"></div>
    </div>

    <div class="checklist-section">
      <div class="day-panel-title"><svg class="icon" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> 오늘의 할 일 체크리스트</div>
      <form class="checklist-add-row" id="checklist-form">
        <input type="text" id="checklist-input" placeholder="할 일을 입력하고 추가" maxlength="80" />
        <select class="checklist-repeat-select" id="checklist-repeat-select" aria-label="반복 주기">
          <option value="none">반복없음</option>
          <option value="daily">매일</option>
          <option value="weekly">매주</option>
          <option value="monthly">매달</option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm">추가</button>
      </form>
      <p class="checklist-repeat-hint" id="checklist-repeat-hint" hidden></p>
      <div class="list" id="checklist-list"></div>
    </div>
  </main>

  <button class="fab" id="add-btn" aria-label="일정 추가"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>

  <nav class="tabbar" aria-label="주요 메뉴">
    <a href="index.html" class="tab-item"><span class="tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="tab-label">홈</span></a>
    <a href="schedule.html" class="tab-item active"><span class="tab-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="tab-label">일정</span></a>
    <a href="investment.html" class="tab-item"><span class="tab-icon"><svg class="icon" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span><span class="tab-label">투자</span></a>
    <a href="diary.html" class="tab-item"><span class="tab-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span class="tab-label">일기</span></a>
  </nav>

  <!-- 일정 등록/수정 모달 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="modal-title">일정 추가</h2>
        <button class="modal-close" id="modal-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <form id="schedule-form">
          <input type="hidden" id="f-id" />
          <div class="field">
            <label for="f-title">제목</label>
            <input type="text" id="f-title" required placeholder="예: 배당금 지급일" />
          </div>
          <div class="row-2">
            <div class="field">
              <label for="f-date">날짜</label>
              <input type="date" id="f-date" required />
            </div>
            <div class="field">
              <label for="f-time">시간 (선택)</label>
              <input type="time" id="f-time" />
            </div>
          </div>
          <div class="field">
            <label>반복</label>
            <div class="segmented" id="repeat-segmented">
              <button type="button" data-value="none" class="active">없음</button>
              <button type="button" data-value="daily">매일</button>
              <button type="button" data-value="weekly">매주</button>
              <button type="button" data-value="monthly">매월</button>
            </div>
            <p class="field-hint" id="repeat-hint" hidden>반복 일정은 전체 시리즈에 대해 수정/삭제됩니다.</p>
          </div>
          <div class="field">
            <label for="f-memo">메모</label>
            <textarea id="f-memo" placeholder="메모 (선택)"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger hidden" id="delete-btn">삭제</button>
        <button type="submit" form="schedule-form" class="btn btn-primary">저장</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/holidays-kr.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
