<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>일기 - 나의 기록장</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3b5bfd" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="나의 기록장" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="lock-gate"></div>

  <div id="app-content" hidden>
    <header class="appbar">
      <span class="appbar-title">일기</span>
      <div class="appbar-left">
        <button class="appbar-action" id="lock-btn" aria-label="잠그기">🔓</button>
        <a href="settings.html" class="appbar-action" aria-label="설정">⚙️</a>
      </div>
    </header>

    <main class="page-content">
      <div class="list" id="diary-list"></div>
    </main>

    <button class="fab" id="add-btn" aria-label="일기 쓰기">+</button>

    <nav class="tabbar" aria-label="주요 메뉴">
      <a href="index.html" class="tab-item"><span class="tab-icon">🏠</span><span class="tab-label">홈</span></a>
      <a href="schedule.html" class="tab-item"><span class="tab-icon">📅</span><span class="tab-label">일정</span></a>
      <a href="investment.html" class="tab-item"><span class="tab-icon">💹</span><span class="tab-label">투자</span></a>
      <a href="diary.html" class="tab-item active"><span class="tab-icon">📔</span><span class="tab-label">일기</span></a>
    </nav>

    <!-- 일기 작성/수정 모달 -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <h2 id="modal-title">일기 쓰기</h2>
          <button class="modal-close" id="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <form id="diary-form">
            <input type="hidden" id="f-id" />
            <div class="field">
              <label for="f-date">날짜</label>
              <input type="date" id="f-date" required />
            </div>
            <div class="field">
              <label>감정 태그 (선택, 1개)</label>
              <div class="chip-group" id="emotion-group">
                <button type="button" class="chip" data-value="불안">불안</button>
                <button type="button" class="chip" data-value="확신">확신</button>
                <button type="button" class="chip" data-value="조급함">조급함</button>
                <button type="button" class="chip" data-value="무덤덤">무덤덤</button>
                <button type="button" class="chip" data-value="흥분">흥분</button>
                <button type="button" class="chip" data-value="후회">후회</button>
              </div>
            </div>
            <div class="field">
              <label for="f-text">오늘의 기록</label>
              <textarea id="f-text" required placeholder="오늘 있었던 일, 생각을 자유롭게 적어보세요" style="min-height:200px;"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger hidden" id="delete-btn">삭제</button>
          <button type="submit" form="diary-form" class="btn btn-primary">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/diary.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
